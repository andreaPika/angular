<!-- company-list.component.html -->
<div *ngIf="isLoading" class="loading">
    <p>Caricamento in corso...</p>
  </div>

  <div *ngIf="!isLoading">
    <h2>{{ 'companyList.title' | translate }}</h2>
    <table>
      <thead>
        <tr>
          <th>Nome Azienda</th>
          <th>Indirizzo</th>
          <th>Id</th>
          <th>Azioni</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let company of companies">
          <td>{{ company.name }}</td>
          <td><div class="map-container">
            <iframe
              width="100%"
              height="300"
              style="border:0"
              loading="lazy"
              allowfullscreen
              referrerpolicy="no-referrer-when-downgrade"
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.835434504695!2d144.9554313153165!3d-37.816178979751894!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6ad642af0f11fd81%3A0xf5776bfa388d948!2sFlinders%20Street%20Station!5e0!3m2!1sen!2sau!4v1673892596453!5m2!1sen!2sau">
            </iframe>
          </div></td>
          <td>{{ company._id}}</td>
          <td>
            <button (click)="viewCompanyDetails(company)">Dettagli</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
