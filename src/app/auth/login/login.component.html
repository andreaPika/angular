<!-- src/app/auth/login/login.component.html -->

<div class="login-container">
    <h2>{{ 'login.title' | translate }}</h2>
    <form (ngSubmit)="login()">
      <mat-form-field appearance="fill">
        <mat-label>{{ 'login.email' | translate }}</mat-label>
        <input matInput type="text" [(ngModel)]="email" name="email" required>
      </mat-form-field>
  
      <mat-form-field appearance="fill">
        <mat-label>{{ 'login.password' | translate }}</mat-label>
        <input matInput type="password" [(ngModel)]="password" name="password" required>
      </mat-form-field>
      <br>
      <button mat-flat-button color="primary" type="submit">{{ 'login.submit' | translate }}</button>
    </form>
    <p>
      {{ 'login.account' | translate }} <a routerLink="/register">{{ 'login.register' | translate }}</a>
      </p>
      <p>
        {{ 'login.accountCompany' | translate }} <a routerLink="/user-register">{{ 'login.register' | translate }}</a>
      </p>
      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>
  </div>
