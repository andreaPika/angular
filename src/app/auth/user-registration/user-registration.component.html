<!-- src/app/auth/register/register.component.html -->
<div class="userregister-container">
    <h2>Register</h2>
    <form (ngSubmit)="register()">
      <mat-form-field appearance="fill">
        <mat-label>FirstName</mat-label>
        <input matInput type="text" [(ngModel)]="firstName" name="firstName" required>
      </mat-form-field>
      <mat-form-field appearance="fill">
        <mat-label>lastName</mat-label>
        <input matInput type="text" [(ngModel)]="lastName" name="lastName" required>
      </mat-form-field>
      <mat-form-field appearance="fill">
        <mat-label>Company</mat-label>
        <input matInput type="text" [(ngModel)]="companyId" name="companyId" required>
      </mat-form-field>
      <mat-form-field appearance="fill">
        <mat-label>email</mat-label>
        <input matInput type="text" [(ngModel)]="email" name="email" required>
      </mat-form-field>
      <mat-form-field appearance="fill">
        <mat-label>Password</mat-label>
        <input matInput type="password" [(ngModel)]="password" name="password" required>
      </mat-form-field>
  <br>
      <button mat-flat-button color="primary" type="submit">Register</button>
    </form>
    <p>
      Already have an account? <a routerLink="/login">Login here</a>
    </p>
  </div>
