<div class="change-password-container">
    <h2>Cambia Password</h2>
    <form [formGroup]="changePasswordForm" (ngSubmit)="changePassword()">
      <div>
        <label for="currentPassword">Password corrente</label>
        <input id="currentPassword" type="password" formControlName="currentPassword" required />
      </div>
      <div>
        <label for="newPassword">Nuova password</label>
        <input id="newPassword" type="password" formControlName="newPassword" required />
      </div>
      <div>
        <label for="confirmPassword">Conferma nuova password</label>
        <input id="confirmPassword" type="password" formControlName="confirmPassword" required />
      </div>
      <button type="submit" [disabled]="changePasswordForm.invalid">Cambia Password</button>
    </form>
    <div *ngIf="successMessage" class="success">{{ successMessage }}</div>
    <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>
  </div>
