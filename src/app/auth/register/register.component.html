<!-- src/app/auth/register/register.component.html -->
<div class="register-container">
    <h2>{{ 'register.title' | translate }}</h2>
    <form (ngSubmit)="register()">
      <mat-form-field appearance="fill">
        <mat-label>{{ 'register.firstName' | translate }}</mat-label>
        <input matInput type="text" [(ngModel)]="firstName" name="firstName" required>
      </mat-form-field>
      <mat-form-field appearance="fill">
        <mat-label>{{ 'register.lastName' | translate }}</mat-label>
        <input matInput type="text" [(ngModel)]="lastName" name="lastName" required>
      </mat-form-field>
      <mat-form-field appearance="fill">
        <mat-label>{{ 'register.email' | translate }}</mat-label>
        <input matInput type="text" [(ngModel)]="email" name="email" required>
      </mat-form-field>
      <mat-form-field appearance="fill">
        <mat-label>{{ 'register.password' | translate }}</mat-label>
        <input matInput type="password" [(ngModel)]="password" name="password" required>
      </mat-form-field>
  <br>
      <button mat-flat-button color="primary" type="submit">{{ 'register.submit' | translate }}</button>
    </form>
    <p>
      {{ 'register.account' | translate }} <a routerLink="/login">{{ 'register.login' | translate }}</a>
    </p>
  </div>
